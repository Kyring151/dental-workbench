</head>
<body data-page="cases">

  <!-- ======== App Shell / Top Bar ======== -->
  <header class="top-bar">
    <div class="top-bar__inner">
      <a href="index.html" class="brand">

          <svg xmlns="http://www.w3.org/2000/svg" width="27" height="30" viewBox="0 0 54 60"><defs><linearGradient id="toothGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#CFF0FE"/></linearGradient></defs><path d="M27 4C17 4 11 9.8 10.5 20L10.7 28c.6 9 3.1 16 6.8 21 .8 1 2.7 1 3.1-.3l1.4-4.3c.3-.8 1.9-.8 2.2 0l1.8 5.4c.6 1.8 3.6 1.8 4.2 0l1.8-5.4c.3-.8 1.9-.8 2.2 0l1.4 4.3c.4 1.3 2.3 1.3 3.1.3 3.7-5 6.2-12 6.8-21l.2-8c-.5-10.2-6.5-16-16.5-16z" fill="url(#toothGrad)" stroke="#7DD3FC" stroke-width="2.2" stroke-linejoin="round"/><circle cx="22" cy="18" r="3.2" fill="#0EA5E9"/><circle cx="32" cy="18" r="3.2" fill="#0EA5E9"/><circle cx="23.2" cy="16.6" r="1.1" fill="#fff"/><circle cx="33.2" cy="16.6" r="1.1" fill="#fff"/><path d="M24 25.5c1.8 1.7 4.2 1.7 6 0" stroke="#0B3B52" stroke-width="1.9" stroke-linecap="round" fill="none"/><ellipse cx="18" cy="24" rx="2.7" ry="1.7" fill="#F9A8D4" opacity="0.55"/><ellipse cx="36" cy="24" rx="2.7" ry="1.7" fill="#F9A8D4" opacity="0.55"/><ellipse cx="23" cy="8.6" rx="3.4" ry="2" fill="#fff" opacity="0.85" transform="rotate(-14 23 8.6)"/></svg>
        </span>
        <span>齿案台</span>
      </a>
      <nav class="top-bar__nav" aria-label="主导航">
        <a href="index.html" class="nav-link" data-nav="dashboard">工作台</a>
        <a href="cases.html" class="nav-link" data-nav="cases">病例列表</a>
        <a href="new-case.html" class="nav-link" data-nav="new-case">新建病例</a>
        <a href="case-detail.html" class="nav-link" data-nav="case-detail">病例详情</a>
      </nav>
      <button class="menu-toggle" aria-label="打开菜单" aria-expanded="false">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
      </button>
    </div>
  </header>

  <div class="mobile-nav" id="mobile-nav">
    <a href="index.html" class="nav-link" data-nav="dashboard">工作台</a>
    <a href="cases.html" class="nav-link" data-nav="cases">病例列表</a>
    <a href="new-case.html" class="nav-link" data-nav="new-case">新建病例</a>
    <a href="case-detail.html" class="nav-link" data-nav="case-detail">病例详情</a>
  </div>
  <!-- ======== / App Shell / Top Bar ======== -->

  <main class="page">
    <div class="page__header">
      <div>
        <div class="breadcrumbs">
          <a href="index.html">工作台</a>
          <span class="breadcrumbs__sep" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </span>
          <span>病例列表</span>
        </div>
        <h1 class="page__title">病例列表</h1>
        <p class="page__subtitle" id="cases-count">共 0 个病例</p>
      </div>
      <div class="page__actions">
        <div class="view-toggle" role="group" aria-label="视图切换">
          <button class="view-toggle__btn view-toggle__btn--active" data-view="grid" aria-label="卡片视图">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          </button>
          <button class="view-toggle__btn" data-view="list" aria-label="列表视图">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          </button>
        </div>
        <button class="btn btn--secondary" type="button" id="btn-export-data">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          导出备份
        </button>
        <label class="btn btn--secondary" for="btn-import-data">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
          导入
        </label>
        <input type="file" id="btn-import-data" accept=".json,application/json" style="display:none" />
        <a href="new-case.html" class="btn btn--primary">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          新建病例
        </a>
      </div>
    </div>

    <!-- 筛选栏 -->
    <div class="filter-bar">
      <div class="search-box">
        <span class="search-box__icon" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>
        <input type="text" class="input" id="cases-search" placeholder="搜索患者、诊断、主诉、治疗方式…" />
      </div>
      <div class="filter-group" role="group" aria-label="筛选">
        <button class="filter-chip filter-chip--active" data-filter="全部">全部</button>
        <button class="filter-chip" data-filter="已完成">已完成</button>
        <button class="filter-chip" data-filter="进行中">进行中</button>
        <button class="filter-chip" data-filter="根管治疗">根管治疗</button>
        <button class="filter-chip" data-filter="种植修复">种植修复</button>
        <button class="filter-chip" data-filter="牙周治疗">牙周治疗</button>
      </div>
      <div class="filter-group" role="group" aria-label="按标签筛选" id="cases-tagfilter"></div>
    </div>

    <!-- 卡片视图 -->
    <div class="case-grid" id="cases-grid-view"><!-- JS 渲染 --></div>

    <!-- 列表视图 -->
    <div class="list-view" id="cases-list-view" style="display: none;"><!-- JS 渲染 --></div>
  </main>
</body>
</html>
